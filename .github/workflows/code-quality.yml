name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python style and syntax
        run: |
          ruff check .
          black --check .
          python -m compileall -q .
          python run_online.py --help
